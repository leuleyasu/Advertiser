name: Deploy Advertiser App to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get
        working-directory: advertiser

      - name: 🔨 Build Flutter Web Application
        run: flutter build web --release
        working-directory: advertiser

      - name: 🚀 Deploy to Firebase Hosting (advertisersignange)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIGHT_MUSIC_TOUGHT }}'
          target: advertiser
          channelId: live
          projectId: night-music-tought
        env:
          FIREBASE_CLI_PREVIEWS: hosting:targets
